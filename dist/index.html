<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08091a">
  <meta name="description" content="Neon Getaway: a fast arcade driving escape through a glowing city.">
  <title>Neon Getaway — Arcade Driving Escape</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>NEON <em>GETAWAY</em></span></div>
      <div class="top-actions">
        <span class="edition">MIDNIGHT RUN // 01</span>
        <button id="soundButton" class="icon-button" type="button" aria-label="Turn sound on" title="Toggle sound">♪ <span id="soundLabel">OFF</span></button>
      </div>
    </header>

    <section class="game-layout" aria-label="Neon Getaway game">
      <div class="game-column">
        <div class="hud" aria-live="off">
          <div class="hud-block score-block"><span class="hud-label">SCORE</span><strong id="score">000000</strong></div>
          <div class="hud-block"><span class="hud-label">BEST</span><strong id="best">000000</strong></div>
          <div class="hud-block heat-block"><span class="hud-label">HEAT <span id="heatText">0%</span></span><span class="meter"><span id="heatFill" class="heat-fill"></span></span></div>
          <div class="hud-block boost-block"><span class="hud-label">BOOST <span id="boostText">35%</span></span><span class="meter"><span id="boostFill" class="boost-fill"></span></span></div>
          <div class="hud-block damage-block"><span class="hud-label">CAR</span><span id="health" class="health" aria-label="3 of 3 car health">◆ ◆ ◆</span></div>
        </div>

        <div id="gameFrame" class="game-frame">
          <canvas id="gameCanvas" aria-label="Top-down neon driving game" role="img"></canvas>
          <div class="stage-vignette" aria-hidden="true"></div>
          <div id="toast" class="toast" aria-live="polite"></div>
          <div id="boostNotice" class="boost-notice" aria-hidden="true">FULL THROTTLE</div>

          <div id="startScreen" class="screen start-screen">
            <div class="screen-kicker"><span class="live-dot"></span> THE CITY IS ON YOUR TAIL</div>
            <h1>NEON<br><em>GETAWAY</em></h1>
            <p class="screen-copy">Slip through traffic. Thread the gap. Stay ahead of the heat.</p>
